name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BRANCH="$HEAD_REF"
          else
            BRANCH="$REF_NAME"
          fi

          # Push sur main/master : pas de contrainte de naming
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            echo "Branche de base autorisée : $BRANCH"
            exit 0
          fi

          # Dependabot
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branche Dependabot autorisée : $BRANCH"
            exit 0
          fi

          PATTERN='^(feat|fix|docs|style|refactor|test|chore)/issue-[0-9]+(-[a-z0-9]+)*$'

          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "Nom de branche valide : $BRANCH"
            exit 0
          fi

          echo "::error::Nom de branche invalide : '$BRANCH'"
          echo "Format attendu : type/issue-XXX-description-courte"
          echo "Types autorisés : feat, fix, docs, style, refactor, test, chore"
          echo "Exemples :"
          echo "  feat/issue-12-liste-aventuriers"
          echo "  fix/issue-8-taux-journalier"
          echo "  chore/issue-1-config-ci"
          exit 1

  front:
    name: Compile Front
    needs: [branch-name]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  back:
    name: Compile Back
    needs: [branch-name]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests compile

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: [branch-name, front, back]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install front dependencies
        working-directory: front
        run: npm ci

      - name: Compile back
        working-directory: back
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests compile

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: -Dsonar.qualitygate.wait=true
