name: Branch name

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, master]

jobs:
  validate:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # Autorisés hors convention : Dependabot
          if [[ "$BRANCH" == dependabot/* ]]; then
            echo "Branche Dependabot autorisée : $BRANCH"
            exit 0
          fi

          # Format : type/issue-XXX-description-en-kebab-case
          PATTERN='^(feat|fix|docs|style|refactor|test|chore)/issue-[0-9]+(-[a-z0-9]+)*$'

          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "Nom de branche valide : $BRANCH"
            exit 0
          fi

          echo "::error::Nom de branche invalide : '$BRANCH'"
          echo "Format attendu : type/issue-XXX-description-courte"
          echo "Types autorisés : feat, fix, docs, style, refactor, test, chore"
          echo "Exemples :"
          echo "  feat/issue-12-liste-aventuriers"
          echo "  fix/issue-8-taux-journalier"
          echo "  chore/issue-1-config-ci"
          exit 1
