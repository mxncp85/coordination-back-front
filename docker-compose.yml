services:
  back:
    build:
      context: ./back
    ports:
      - "8080:8080"
    volumes:
      - ./back/src:/app/src
      - ./back/pom.xml:/app/pom.xml
      - back_m2:/root/.m2
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

  front:
    build:
      context: ./front
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://back:8080
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - back

volumes:
  front_node_modules:
  back_m2:
