spring.application.name=capuches-dopale

# Redémarrage DevTools plus réactif sous Docker (volumes / Windows)
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# Base de données (valeurs pour un lancement hors Docker ; docker-compose les remplace par variables d'environnement)
spring.datasource.url=jdbc:postgresql://localhost:5432/capale
spring.datasource.username=capale
spring.datasource.password=capale

# Le schéma est géré uniquement par Flyway ; Hibernate vérifie seulement que les entités correspondent
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations nommées par date (voir documentation/base-de-donnees.md)
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
